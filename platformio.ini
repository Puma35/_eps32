; ============================================================
;  PlatformIO — picsetvoc
;  Carte   : Seeed Studio XIAO ESP32S3 Sense
;  MCU     : ESP32-S3R8, Xtensa LX7 dual-core @ 240 MHz
;  Flash   : 8 MB on-chip   |  PSRAM : 8 MB OPI on-chip
;  SD      : jusqu'à 32 GB FAT (SPI2/HSPI)
;  Micro   : PDM intégré (GPIO42=CLK, GPIO41=DATA)
;  Caméra  : OV2640 (sessions VAD : audio.wav + photo.jpg)
; ============================================================

[env:xiaos3sense]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

; Flash 8 MB on-chip
board_build.flash_size = 8MB

; PSRAM OPI 8 MB — requis pour esp_camera framebuffer
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; Moniteur serie -- XIAO USB CDC @ 115200 baud
; monitor_rts/dtr non forcer : le moniteur resette la carte a l'ouverture (comportement standard)
; Workflow : ouvrir moniteur -> carte reset automatique -> logs visibles depuis le debut
monitor_speed   = 115200
monitor_port    = COM4
monitor_filters = esp32_exception_decoder
